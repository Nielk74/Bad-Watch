name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'm4-pro' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: runner.environment == 'github-hosted'
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      # Keep this identical to the release gate: app JVM tests are easy to accidentally
      # skip when only :core and :server are named explicitly.
      - name: Release-quality gate
        run: >-
          ./gradlew test :app:lintDebug :app:assembleDebug :app:assembleRelease
          --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-watch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
