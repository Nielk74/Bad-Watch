name: Release

# Cutting a release is `tooling/tag_release.sh <version>` followed by pushing the tag.
# This workflow does the rest: build, sign (when the keystore secrets are configured),
# and publish the GitHub Release with notes taken from CHANGELOG.md.
#
# Tags are immutable release inputs, so this workflow validates the tagged commit itself.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, android, m4-pro, trusted]
    env:
      # Mapped at job level so steps can test for presence — `if:` cannot read secrets.
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: runner.environment == 'github-hosted'
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Verify data tooling
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 -m py_compile tools/ingest.py tools/train.py \
            tooling/wear_session_probe.py tooling/wear_recovery_probe.py

      - name: Release-quality gate
        run: >-
          ./gradlew test :app:lintDebug :app:assembleDebug :app:assembleRelease
          --stacktrace --no-daemon

      # The debug APK is signed with the debug key, so it is always installable via adb.
      # It goes into every release as the no-secrets-needed artifact.
      - name: Stage debug APK
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/bad-watch-$VERSION-debug.apk"

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      # Release builds carry no signing config on purpose: the keystore lives only in
      # GitHub secrets. Signing happens here, on the unsigned AGP output.
      - name: Sign release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "dist/bad-watch-$VERSION.apk" /tmp/aligned.apk

      - name: Note unsigned release
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "No RELEASE_KEYSTORE_* secrets configured — publishing the debug-signed" \
            "APK only. Add the four secrets to attach a properly signed release APK."

      - name: Verify APK identity and signatures
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in dist/*.apk; do
            "$BT/apksigner" verify --verbose "$APK"
            BADGING=$("$BT/aapt" dump badging "$APK")
            PACKAGE_LINE=$(grep -m1 '^package:' <<<"$BADGING")
            echo "$PACKAGE_LINE"
            grep -F "package: name='com.badwatch.badwatch'" <<<"$PACKAGE_LINE"
            grep -F "versionName='$VERSION'" <<<"$PACKAGE_LINE"
          done

      - name: Write checksums
        run: |
          set -euo pipefail
          for APK in dist/*.apk; do
            shasum -a 256 "$APK" > "$APK.sha256"
          done

      # Notes are the CHANGELOG section for this version; the tag_release.sh template
      # guarantees the section exists. Fall back to a one-liner if it is empty.
      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "Release $VERSION" > release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Bad Watch $GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            dist/*
