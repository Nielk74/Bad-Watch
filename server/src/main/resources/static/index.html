<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bad Watch — Training Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --surface-2: #ececea;
    --border:    #dcdcd8;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #78776f;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --status-good:     #1baf7a;
    --status-warning:  #eda100;
    --status-critical: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --border:    #33332f;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e85;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --status-good:     #199e70;
      --status-warning:  #c98500;
      --status-critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #232322;
    --border:    #33332f;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8f8e85;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --status-good:     #199e70;
    --status-warning:  #c98500;
    --status-critical: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 72px; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .sub { color: var(--text-secondary); font-size: 14px; }
  .theme-toggle {
    background: var(--surface-2); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text-primary); }
  .data-actions { margin-left: auto; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .data-action {
    background: var(--surface-1); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .data-action:hover { color: var(--text-primary); border-color: var(--text-muted); }
  .data-action:disabled { cursor: wait; opacity: .55; }
  .transfer-status { min-height: 20px; margin-top: 8px; color: var(--text-secondary); font-size: 12.5px; }
  .transfer-status.error { color: var(--status-critical); }

  .auth-dialog {
    width: min(420px, calc(100vw - 32px)); padding: 0;
    color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 24px 80px rgba(0,0,0,.28);
  }
  .auth-dialog::backdrop { background: rgba(8, 8, 7, .58); backdrop-filter: blur(4px); }
  .auth-form { padding: 24px; }
  .auth-kicker { color: var(--series-1); font-size: 11.5px; font-weight: 700;
                 letter-spacing: .08em; text-transform: uppercase; }
  .auth-form h2 { margin: 5px 0 7px; font-size: 22px; letter-spacing: -.015em; }
  .auth-form > p { margin: 0; color: var(--text-secondary); font-size: 13.5px; }
  .auth-field { display: grid; gap: 6px; margin-top: 20px; }
  .auth-field label { color: var(--text-secondary); font-size: 12.5px; font-weight: 600; }
  .auth-field input {
    width: 100%; padding: 11px 12px; color: var(--text-primary); background: var(--surface-0);
    border: 1px solid var(--border); border-radius: 10px; font: inherit;
  }
  .auth-field input:focus { border-color: var(--series-1); outline: 3px solid color-mix(in srgb, var(--series-1) 20%, transparent); }
  .auth-form .auth-error { margin-top: 8px; color: var(--status-critical); font-size: 12.5px; }
  .auth-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
  .auth-actions button {
    border: 1px solid var(--border); border-radius: 999px; padding: 8px 15px;
    background: var(--surface-2); color: var(--text-primary); font: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .auth-actions .primary { border-color: var(--series-1); background: var(--series-1); color: white; }

  h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
  .card-note { color: var(--text-muted); font-size: 12.5px; margin: 2px 0 0; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin: 24px 0; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .tile .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .tile .value { font-size: 30px; font-weight: 620; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .foot { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px 14px; min-width: 0; }
  .card-head { margin-bottom: 14px; }
  .chart-scroll { overflow-x: auto; }
  svg { display: block; max-width: 100%; }
  .axis text { fill: var(--text-muted); font-size: 11px; }
  .axis line, .axis path { stroke: var(--border); }
  .gridline { stroke: var(--border); stroke-dasharray: 2 4; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 560; }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 550; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  td { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  td:first-child { color: var(--text-primary); }
  tbody tr:hover td { background: var(--surface-2); }

  .tooltip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1.45;
    box-shadow: 0 6px 22px rgba(0,0,0,.16); z-index: 20; max-width: 240px;
  }
  .tooltip .t-title { font-weight: 600; margin-bottom: 3px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 14px; color: var(--text-secondary); }
  .tooltip .t-row b { color: var(--text-primary); font-weight: 560; font-variant-numeric: tabular-nums; }

  .insights { display: flex; flex-direction: column; gap: 12px; }
  .insight { display: flex; gap: 12px; padding: 13px 15px; border-radius: 11px;
             background: var(--surface-2); border-left: 3px solid var(--text-muted); }
  .insight.notable { border-left-color: var(--series-1); }
  .insight.caution { border-left-color: var(--status-warning); }
  .insight .body { min-width: 0; }
  .insight h3 { margin: 0 0 3px; font-size: 14.5px; font-weight: 600; }
  .insight p { margin: 0; font-size: 13.5px; color: var(--text-secondary); }
  .insight .evidence { margin-top: 5px; font-size: 12px; color: var(--text-muted);
                       font-variant-numeric: tabular-nums; }
  .insight-session { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }

  .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .score { background: var(--surface-2); border-radius: 10px; padding: 11px 13px; }
  .score .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .score .v { font-size: 21px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .caveat { margin-top: 12px; font-size: 12.5px; color: var(--text-muted); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .empty code { background: var(--surface-2); padding: 2px 7px; border-radius: 5px; font-size: 13px; }
  section { margin-top: 26px; }
  .full { grid-column: 1 / -1; }

  .backlink { display: inline-block; margin-bottom: 8px; color: var(--text-secondary);
              text-decoration: none; font-size: 13.5px; }
  .backlink:hover { color: var(--text-primary); text-decoration: underline; }
  .detail-head { margin: 18px 0 4px; }
  .detail-title { font-size: 20px; font-weight: 640; letter-spacing: -0.01em; }
  .detail-meta { color: var(--text-secondary); font-size: 13.5px; margin-top: 3px; }
  .review-banner { margin: 18px 0 -6px; padding: 14px 16px; border: 1px solid
                   color-mix(in srgb, var(--series-1) 42%, var(--border)); border-radius: 12px;
                   background: color-mix(in srgb, var(--series-1) 9%, var(--surface-1)); }
  .review-banner.clean { border-color: var(--border); background: var(--surface-1); }
  .review-banner .kicker { color: var(--series-1); font-size: 11.5px; font-weight: 700;
                           letter-spacing: .06em; text-transform: uppercase; }
  .review-banner.clean .kicker { color: var(--text-muted); }
  .review-banner strong { display: block; margin-top: 3px; font-size: 14px; }
  .review-banner p { margin: 5px 0 0; color: var(--text-secondary); font-size: 12.5px;
                     line-height: 1.45; }
  .audit-card { border-style: dashed; background: color-mix(in srgb, var(--surface-1) 82%, var(--surface-0)); }
  .audit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 10px; margin: 14px 0 0; }
  .audit-stat { padding: 11px 12px; border-radius: 9px; background: var(--surface-2); }
  .audit-stat .k { color: var(--text-muted); font-size: 11.5px; }
  .audit-stat .v { margin-top: 2px; font-size: 18px; font-weight: 620;
                   font-variant-numeric: tabular-nums; }
  .audit-notes { margin: 12px 0 0; color: var(--text-secondary); font-size: 12.5px;
                 line-height: 1.5; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }

  .diary-card { padding-bottom: 20px; }
  .diary-title-row { display: flex; justify-content: space-between; align-items: flex-start;
                     gap: 14px; margin-bottom: 18px; }
  .diary-state { flex: none; padding: 4px 9px; border: 1px solid var(--border);
                 border-radius: 999px; color: var(--text-secondary); font-size: 11.5px; }
  .diary-section { border: 0; padding: 0; margin: 20px 0 0; min-width: 0; }
  .diary-section:first-of-type { margin-top: 0; }
  .diary-section legend { width: 100%; margin-bottom: 10px; color: var(--text-primary);
                          font-size: 13px; font-weight: 650; }
  .diary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
                gap: 12px 14px; }
  .diary-field { display: grid; align-content: start; gap: 5px; min-width: 0; }
  .diary-field.wide { grid-column: 1 / -1; }
  .diary-field label { color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .diary-field .hint { color: var(--text-muted); font-size: 11.5px; line-height: 1.35; }
  .diary-field input, .diary-field select, .diary-field textarea {
    width: 100%; min-width: 0; padding: 9px 10px; color: var(--text-primary);
    background: var(--surface-0); border: 1px solid var(--border); border-radius: 9px;
    font: inherit; font-size: 13.5px;
  }
  .diary-field textarea { resize: vertical; min-height: 88px; }
  .diary-field input:focus, .diary-field select:focus, .diary-field textarea:focus {
    border-color: var(--series-1); outline: 3px solid color-mix(in srgb, var(--series-1) 18%, transparent);
  }
  .diary-check { display: flex; align-items: flex-start; gap: 9px; padding: 9px 0; }
  .diary-check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--series-1); }
  .diary-check label { color: var(--text-secondary); font-size: 13px; }
  .diary-existing { margin-top: 5px; color: var(--text-muted); font-size: 12px; }
  .diary-actions { display: flex; align-items: center; justify-content: flex-end;
                   flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .diary-status { flex: 1; min-width: 180px; color: var(--text-secondary); font-size: 12.5px; }
  .diary-status.error { color: var(--status-critical); }
  .diary-save { border: 1px solid var(--series-1); border-radius: 999px; padding: 8px 16px;
                background: var(--series-1); color: white; font: inherit; font-size: 13px;
                font-weight: 650; cursor: pointer; }
  .diary-save:disabled { cursor: wait; opacity: .58; }
  @media (max-width: 520px) {
    .wrap { padding-left: 14px; padding-right: 14px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .diary-grid { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bad Watch</h1>
    <span class="sub" id="subtitle">Loading…</span>
    <nav class="data-actions" aria-label="Your data">
      <button class="data-action" id="downloadArchive" type="button">Backup JSON</button>
      <button class="data-action" id="downloadCsv" type="button">Export CSV</button>
      <button class="data-action" id="restoreArchive" type="button">Restore</button>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button">Theme</button>
  </header>
  <div class="transfer-status" id="transferStatus" role="status" aria-live="polite"></div>
  <input id="archiveFile" type="file" accept="application/json,.json" hidden>

  <div id="content"></div>
</div>

<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<dialog class="auth-dialog" id="authDialog" aria-labelledby="authTitle">
  <form class="auth-form" id="authForm">
    <div class="auth-kicker">Private dashboard</div>
    <h2 id="authTitle">Enter your access token</h2>
    <p>The server protects your session and health data. The token stays in this browser
      tab and is sent only in an Authorization header.</p>
    <div class="auth-field">
      <label for="authToken">BADWATCH_TOKEN</label>
      <input id="authToken" type="password" autocomplete="current-password"
             spellcheck="false" required>
    </div>
    <p class="auth-error" id="authError" hidden>That token was not accepted. Try again.</p>
    <div class="auth-actions">
      <button id="authCancel" type="button">Cancel</button>
      <button class="primary" type="submit">Unlock dashboard</button>
    </div>
  </form>
</dialog>

<script>
const NS = "http://www.w3.org/2000/svg";
const SHOT_LABELS = {
  Smash: "Smash", Clear: "Clear", Drop: "Drop",
  Drive: "Drive", BackhandDrive: "Backhand drive", Unknown: "Unclassified"
};
// Fixed slot order — a shot type keeps its hue no matter which types appear.
const SHOT_SLOT = {
  Smash: 1, Clear: 2, Drop: 3, Drive: 4, BackhandDrive: 5, Unknown: 6
};

/* ---------- Authenticated API ---------- */

const TOKEN_STORAGE_KEY = "badwatch.bearerToken";
let volatileToken = null;
let authPromptInFlight = null;

function readAccessToken() {
  if (volatileToken) return volatileToken;
  try { return sessionStorage.getItem(TOKEN_STORAGE_KEY); }
  catch (_) { return null; }
}

function rememberAccessToken(token) {
  volatileToken = token;
  try { sessionStorage.setItem(TOKEN_STORAGE_KEY, token); }
  catch (_) { /* Some privacy modes disable storage; memory still works for this page. */ }
}

function forgetAccessToken() {
  volatileToken = null;
  try { sessionStorage.removeItem(TOKEN_STORAGE_KEY); }
  catch (_) { /* Nothing else to clear. */ }
}

function askForAccessToken(previousWasRejected) {
  const dialog = document.getElementById("authDialog");
  const form = document.getElementById("authForm");
  const input = document.getElementById("authToken");
  const cancel = document.getElementById("authCancel");
  const error = document.getElementById("authError");

  if (authPromptInFlight) {
    if (previousWasRejected) error.hidden = false;
    return authPromptInFlight;
  }

  error.hidden = !previousWasRejected;
  input.value = "";
  authPromptInFlight = new Promise(resolve => {
    const finish = token => {
      form.removeEventListener("submit", submit);
      cancel.removeEventListener("click", cancelPrompt);
      dialog.removeEventListener("cancel", cancelPrompt);
      if (dialog.open) dialog.close();
      authPromptInFlight = null;
      resolve(token);
    };
    const submit = event => {
      event.preventDefault();
      const token = input.value.trim();
      if (token) finish(token);
    };
    const cancelPrompt = event => {
      event.preventDefault();
      finish(null);
    };

    form.addEventListener("submit", submit);
    cancel.addEventListener("click", cancelPrompt);
    dialog.addEventListener("cancel", cancelPrompt);
    dialog.showModal();
    requestAnimationFrame(() => input.focus());
  });
  return authPromptInFlight;
}

function fetchWithAccessToken(resource, init, token) {
  const headers = new Headers((init && init.headers) || {});
  if (token) headers.set("Authorization", `Bearer ${token}`);
  return fetch(resource, { ...(init || {}), headers });
}

/**
 * Fetch a same-origin API route. A tokenless local server stays one request and zero UI;
 * a protected server asks once, keeps the secret in sessionStorage, and retries every
 * concurrent dashboard request through the same prompt.
 */
async function apiFetch(resource, init = {}) {
  let token = readAccessToken();
  let response = await fetchWithAccessToken(resource, init, token);

  while (response.status === 401) {
    forgetAccessToken();
    const supplied = await askForAccessToken(Boolean(token));
    if (!supplied) return response;
    rememberAccessToken(supplied);
    token = supplied;
    response = await fetchWithAccessToken(resource, init, token);
  }
  return response;
}

async function apiJson(resource) {
  const response = await apiFetch(resource);
  if (!response.ok) {
    const error = new Error(response.status === 401 ? "Access token required" : `HTTP ${response.status}`);
    error.status = response.status;
    throw error;
  }
  return response.json();
}

/* ---------- Data ownership ---------- */

const transferStatus = document.getElementById("transferStatus");

function reportTransfer(message, isError = false) {
  transferStatus.textContent = message;
  transferStatus.classList.toggle("error", isError);
}

function attachmentFilename(response, fallback) {
  const disposition = response.headers.get("Content-Disposition") || "";
  const match = disposition.match(/filename="?([^";]+)"?/i);
  return match ? match[1] : fallback;
}

async function downloadOwnerData(button, path, fallbackName) {
  button.disabled = true;
  reportTransfer("Preparing download…");
  try {
    const response = await apiFetch(path);
    if (!response.ok) throw new Error(`Download failed (HTTP ${response.status})`);
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = attachmentFilename(response, fallbackName);
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    reportTransfer(`Downloaded ${link.download}.`);
  } catch (error) {
    reportTransfer(error.message || "Download failed.", true);
  } finally {
    button.disabled = false;
  }
}

document.getElementById("downloadArchive").addEventListener("click", event => {
  downloadOwnerData(event.currentTarget, "api/v1/export/archive", "badwatch-archive.json");
});

document.getElementById("downloadCsv").addEventListener("click", event => {
  downloadOwnerData(event.currentTarget, "api/v1/export/sessions.csv", "badwatch-sessions.csv");
});

const archiveFile = document.getElementById("archiveFile");
const restoreButton = document.getElementById("restoreArchive");
restoreButton.addEventListener("click", () => {
  archiveFile.value = "";
  archiveFile.click();
});

archiveFile.addEventListener("change", async () => {
  const file = archiveFile.files && archiveFile.files[0];
  if (!file) return;
  const approved = window.confirm(
    "Restore this Bad Watch archive? New records are added. Same-ID sessions merge only " +
      "when their recorded evidence and edit history are compatible; a conflict stops the " +
      "restore. Existing records absent from the archive are kept."
  );
  if (!approved) return;

  restoreButton.disabled = true;
  reportTransfer(`Validating ${file.name}…`);
  try {
    const response = await apiFetch("api/v1/import/archive", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: file
    });
    if (!response.ok) {
      let detail = `Restore failed (HTTP ${response.status})`;
      try {
        const payload = await response.json();
        if (payload.error) detail = payload.error;
      } catch (_) { /* Keep the status-only error. */ }
      throw new Error(detail);
    }
    const result = await response.json();
    const changed = result.sessions.created + result.sessions.replaced +
      result.captures.created + result.captures.replaced;
    reportTransfer(
      `Restore complete: ${changed} changed, ` +
        `${result.sessions.unchanged + result.captures.unchanged} already current.`
    );
    sessionCache.clear();
    window.__data = await apiJson("api/v1/dashboard");
    location.hash = "#/";
    route();
  } catch (error) {
    reportTransfer(error.message || "Restore failed.", true);
  } finally {
    restoreButton.disabled = false;
  }
});

const tooltip = document.getElementById("tooltip");
function showTip(evt, html) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = "1";
  const pad = 14, r = tooltip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - pad;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
function hideTip() { tooltip.style.opacity = "0"; }

function el(tag, attrs = {}, parent = null) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
  ));
}

const fmtInt = n => Math.round(n).toLocaleString();
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString(undefined, { minimumFractionDigits: 1 });
function hasConfiguredHeartRateReserve(profile) {
  return !!profile &&
    !!profile.restingHeartRateSource && profile.restingHeartRateSource !== "Unconfigured" &&
    !!profile.maxHeartRateSource && profile.maxHeartRateSource !== "Unconfigured";
}
function fmtDuration(ms) {
  const h = Math.floor(ms / 3600000), m = Math.round((ms % 3600000) / 60000);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function fmtDate(ms) {
  return new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function fmtDateTime(ms) {
  return new Date(ms).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function fmtDateTimeLong(ms) {
  return new Date(ms).toLocaleString(undefined, {
    weekday: "short", day: "numeric", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
}
/** Minutes:seconds relative to a session start, for timeline axes and tooltips. */
function fmtClock(ms) {
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
  return `${m}:${String(s).padStart(2, "0")}`;
}

/* ---------- Charts ---------- */

/**
 * Vertical bars. One hue: colour is not encoding anything here, height already is.
 */
function barChart(host, data, opts = {}) {
  const W = Math.max(opts.minWidth || 420, host.clientWidth || 460);
  const H = opts.height || 210;
  const M = { top: 12, right: 12, bottom: 34, left: 44 };
  const iw = W - M.left - M.right, ih = H - M.top - M.bottom;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img" }, host);
  const g = el("g", { transform: `translate(${M.left},${M.top})` }, svg);

  const max = Math.max(1, ...data.map(d => d.value));
  const ticks = niceTicks(max, 4);
  const yTop = ticks[ticks.length - 1];
  const y = v => ih - (v / yTop) * ih;

  for (const t of ticks) {
    el("line", { class: "gridline", x1: 0, x2: iw, y1: y(t), y2: y(t) }, g);
    const label = el("text", { class: "axis", x: -8, y: y(t) + 4, "text-anchor": "end" }, g);
    label.textContent = fmtInt(t);
  }

  // 2px surface gap between adjacent bars.
  const slot = iw / data.length;
  const bw = Math.max(3, Math.min(opts.maxBarWidth || 42, slot - 2));

  data.forEach((d, i) => {
    const x = i * slot + (slot - bw) / 2;
    const h = Math.max(d.value > 0 ? 2 : 0, ih - y(d.value));
    if (h > 0) {
      const r = el("path", {
        d: roundedTopBar(x, ih - h, bw, h, 4),
        fill: opts.color || "var(--series-1)"
      }, g);
      r.addEventListener("mousemove", e => showTip(e,
        `<div class="t-title">${d.label}</div>
         <div class="t-row"><span>${opts.valueLabel || "Value"}</span><b>${d.display || fmtInt(d.value)}</b></div>`));
      r.addEventListener("mouseleave", hideTip);
    }
    if (data.length <= 14 || i % Math.ceil(data.length / 10) === 0) {
      const t = el("text", { class: "axis", x: i * slot + slot / 2, y: ih + 18, "text-anchor": "middle" }, g);
      t.textContent = d.axisLabel ?? d.label;
    }
  });

  el("line", { class: "axis", x1: 0, x2: iw, y1: ih, y2: ih }, g);
}

/**
 * Horizontal bars for shot mix. Categorical hues in fixed slot order, each row
 * directly labelled so identity never depends on colour alone.
 */
function shotMixChart(host, slices) {
  const total = slices.reduce((a, s) => a + s.count, 0) || 1;
  const rowH = 30, W = Math.max(380, host.clientWidth || 420);
  const labelW = 118, valueW = 74;
  const trackW = Math.max(60, W - labelW - valueW);
  const H = slices.length * rowH + 6;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img" }, host);
  const max = Math.max(...slices.map(s => s.count));

  slices.forEach((s, i) => {
    const y = i * rowH + 4;
    const label = el("text", { class: "axis", x: 0, y: y + 15, "text-anchor": "start" }, svg);
    label.setAttribute("fill", "var(--text-secondary)");
    label.setAttribute("font-size", "12.5");
    label.textContent = SHOT_LABELS[s.type] || s.type;

    const w = Math.max(3, (s.count / max) * trackW);
    const bar = el("path", {
      d: roundedRightBar(labelW, y + 3, w, 15, 4),
      fill: `var(--series-${SHOT_SLOT[s.type] || 6})`
    }, svg);
    bar.addEventListener("mousemove", e => showTip(e,
      `<div class="t-title">${SHOT_LABELS[s.type] || s.type}</div>
       <div class="t-row"><span>Detected hits</span><b>${fmtInt(s.count)}</b></div>
       <div class="t-row"><span>Share</span><b>${Math.round(s.count / total * 100)}%</b></div>`));
    bar.addEventListener("mouseleave", hideTip);

    const val = el("text", { x: labelW + w + 8, y: y + 16, "text-anchor": "start" }, svg);
    val.setAttribute("fill", "var(--text-primary)");
    val.setAttribute("font-size", "12.5");
    val.setAttribute("font-weight", "560");
    val.textContent = `${fmtInt(s.count)} · ${Math.round(s.count / total * 100)}%`;
  });
}

/**
 * Inferred active-time volume. Both lines are milliseconds of the same signal: a rolling
 * seven-day sum and the weekly average across the four complete weeks before that window.
 * Hits and elapsed court time stay in the tooltip instead of being mixed onto this axis.
 */
function volumeChart(host, points) {
  const W = Math.max(440, host.clientWidth || 480);
  const H = 230;
  const M = { top: 12, right: 14, bottom: 34, left: 46 };
  const iw = W - M.left - M.right, ih = H - M.top - M.bottom;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img",
    "aria-label": "Estimated active-time volume" }, host);
  const g = el("g", { transform: `translate(${M.left},${M.top})` }, svg);

  const minutes = ms => ms / 60000;
  const max = Math.max(1, ...points.map(p => Math.max(
    minutes(p.rolling7DayEstimatedActiveMillis),
    minutes(p.previous28DayWeeklyAverageEstimatedActiveMillis || 0)
  )));
  const ticks = niceTicks(max, 4);
  const yTop = ticks[ticks.length - 1];
  const x = i => points.length <= 1 ? iw / 2 : (i / (points.length - 1)) * iw;
  const y = v => ih - (v / yTop) * ih;

  for (const t of ticks) {
    el("line", { class: "gridline", x1: 0, x2: iw, y1: y(t), y2: y(t) }, g);
    const lab = el("text", { class: "axis", x: -8, y: y(t) + 4, "text-anchor": "end" }, g);
    lab.textContent = `${fmtInt(t)}m`;
  }

  const line = (key, color) => {
    let started = false;
    const d = points.map((p, i) => {
      if (p[key] == null) { started = false; return ""; }
      const command = started ? "L" : "M";
      started = true;
      return `${command}${x(i).toFixed(1)},${y(minutes(p[key])).toFixed(1)}`;
    }).filter(Boolean).join(" ");
    if (!d) return;
    el("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, g);
  };
  line("previous28DayWeeklyAverageEstimatedActiveMillis", "var(--series-3)");
  line("rolling7DayEstimatedActiveMillis", "var(--series-1)");

  points.forEach((p, i) => {
    if (points.length <= 20 || i % Math.ceil(points.length / 8) === 0) {
      const t = el("text", { class: "axis", x: x(i), y: ih + 18, "text-anchor": "middle" }, g);
      t.textContent = new Date(p.dayEpochMillis).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    }
  });

  // Invisible hit columns give a hover target far larger than the 2px line.
  const colW = iw / Math.max(1, points.length);
  points.forEach((p, i) => {
    const hit = el("rect", { x: x(i) - colW / 2, y: 0, width: colW, height: ih, fill: "transparent" }, g);
    const marker = el("circle", {
      cx: x(i), cy: y(minutes(p.rolling7DayEstimatedActiveMillis)), r: 0,
      fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2
    }, g);
    hit.addEventListener("mousemove", e => {
      marker.setAttribute("r", 5);
      showTip(e,
        `<div class="t-title">${fmtDate(p.dayEpochMillis)}</div>
         <div class="t-row"><span>Today on court</span><b>${fmtDuration(p.dailyElapsedMillis)}</b></div>
         <div class="t-row"><span>Today est. active</span><b>${fmtDuration(p.dailyEstimatedActiveMillis)}</b></div>
         <div class="t-row"><span>Today detected hits</span><b>${fmtInt(p.dailyDetectedHits)}</b></div>
         <div class="t-row"><span>Last 7 days est. active</span><b>${fmtDuration(p.rolling7DayEstimatedActiveMillis)}</b></div>
         <div class="t-row"><span>Last 7 days detected hits</span><b>${fmtInt(p.rolling7DayDetectedHits)}</b></div>
         <div class="t-row"><span>Prior 4-week weekly avg</span><b>${p.previous28DayWeeklyAverageEstimatedActiveMillis == null
           ? "Building history" : fmtDuration(p.previous28DayWeeklyAverageEstimatedActiveMillis)}</b></div>`);
    });
    hit.addEventListener("mouseleave", () => { marker.setAttribute("r", 0); hideTip(); });
  });

  el("line", { class: "axis", x1: 0, x2: iw, y1: ih, y2: ih }, g);
}

/**
 * One session on a clock. Each inferred exchange is a band spanning its first to its last
 * detected hit, taller the more hits it held, with one tick per hit inside, coloured by
 * provisional type. Empty space is quiet time, not a claim about official rally boundaries.
 *
 * Note: `Rally.durationMillis` is a server-side derived getter and is not on the wire;
 * a rally's span is `startMillis`..`endMillis`, and single-shot rallies have both equal.
 */
function rallyTimelineChart(host, exportData) {
  const rallies = (exportData.rallyProfile && exportData.rallyProfile.rallies) || [];
  const shots = (exportData.session && exportData.session.shots) || [];
  const t0 = exportData.session.startedAtMillis;
  let t1 = exportData.session.endedAtMillis || t0;
  for (const r of rallies) t1 = Math.max(t1, r.endMillis);
  for (const s of shots) t1 = Math.max(t1, s.timestampMillis);
  if (t1 - t0 < 60000) t1 = t0 + 60000; // pad sub-minute sessions so the axis stays readable
  const span = t1 - t0;

  const W = Math.max(620, host.clientWidth || 760);
  const H = 200;
  const M = { top: 14, right: 14, bottom: 30, left: 10 };
  const iw = W - M.left - M.right, ih = H - M.top - M.bottom;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img",
    "aria-label": "Detected exchange timeline" }, host);
  const g = el("g", { transform: `translate(${M.left},${M.top})` }, svg);
  const x = t => ((t - t0) / span) * iw;

  const stepMin = [1, 2, 5, 10, 15, 30, 60].find(s => span / 60000 / s <= 8) || 120;
  for (let m = 0; m * stepMin * 60000 <= span; m++) {
    const tx = x(m * stepMin * 60000);
    el("line", { class: "gridline", x1: tx, x2: tx, y1: 0, y2: ih }, g);
    const lab = el("text", { x: tx, y: ih + 18, "text-anchor": "middle",
      fill: "var(--text-muted)", "font-size": 11 }, g);
    lab.textContent = `${m * stepMin}:00`;
  }

  const maxShots = Math.max(1, ...rallies.map(r => r.shotCount));
  rallies.forEach(r => {
    const bx = x(r.startMillis);
    const bw = Math.max(3, x(r.endMillis) - bx); // single-shot rally: start == end
    const bh = Math.max(22, (r.shotCount / maxShots) * ih);
    const by = ih - bh;
    const band = el("rect", {
      x: bx, y: by, width: bw, height: bh, rx: 5,
      fill: "var(--series-1)", "fill-opacity": 0.15,
      stroke: "var(--series-1)", "stroke-opacity": 0.35
    }, g);
    band.addEventListener("mousemove", e => showTip(e,
      `<div class="t-title">Exchange ${r.index + 1} · ${fmtInt(r.shotCount)} detected hits</div>
       <div class="t-row"><span>Starts</span><b>${fmtClock(r.startMillis - t0)}</b></div>
       <div class="t-row"><span>Lasts</span><b>${Math.round((r.endMillis - r.startMillis) / 1000)}s</b></div>`));
    band.addEventListener("mouseleave", hideTip);

    shots
      .filter(s => s.timestampMillis >= r.startMillis && s.timestampMillis <= r.endMillis)
      .forEach(s => {
        const tx = Math.min(Math.max(x(s.timestampMillis), bx + 2), bx + bw - 2);
        const tick = el("line", {
          x1: tx, x2: tx, y1: by + 4, y2: ih - 3,
          stroke: `var(--series-${SHOT_SLOT[s.type] || 6})`,
          "stroke-width": 3, "stroke-linecap": "round"
        }, g);
        tick.addEventListener("mousemove", e => showTip(e,
          `<div class="t-title">${escapeHtml(SHOT_LABELS[s.type] || s.type)}</div>
           <div class="t-row"><span>At</span><b>${fmtClock(s.timestampMillis - t0)}</b></div>
           ${s.heartRateBpm > 0 ? `<div class="t-row"><span>Heart rate</span><b>${fmtInt(s.heartRateBpm)} bpm</b></div>` : ""}`));
        tick.addEventListener("mouseleave", hideTip);
      });
  });

  el("line", { x1: 0, x2: iw, y1: ih, y2: ih, stroke: "var(--border)" }, g);
}

function roundedTopBar(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h);
  return `M${x},${y + h} L${x},${y + rr} Q${x},${y} ${x + rr},${y} L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr} L${x + w},${y + h} Z`;
}
function roundedRightBar(x, y, w, h, r) {
  const rr = Math.min(r, w, h / 2);
  return `M${x},${y} L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr} L${x + w},${y + h - rr} Q${x + w},${y + h} ${x + w - rr},${y + h} L${x},${y + h} Z`;
}
function niceTicks(max, count) {
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(Math.round(v * 1000) / 1000);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}

/* ---------- Page ---------- */

function render(data) {
  const content = document.getElementById("content");
  const subtitle = document.getElementById("subtitle");
  content.innerHTML = "";

  if (!data.sessionCount) {
    subtitle.textContent = "No sessions yet";
    content.innerHTML = `
      <div class="empty">
        <h2>No sessions yet</h2>
        <p>Record a session on the watch, then point it at this server.<br>
        Sessions upload to <code>POST /api/v1/sessions</code>.</p>
      </div>`;
    return;
  }

  const latest = data.sessions[0];
  subtitle.textContent = `${data.sessionCount} session${data.sessionCount === 1 ? "" : "s"} · last played ${fmtDate(latest.startedAtMillis)}`;

  const latestHasHrLoad = latest.cardiovascularLoad != null && latest.heartRateCoverage >= 0.6;

  const tiles = document.createElement("div");
  tiles.className = "tiles";
  tiles.innerHTML = `
    <div class="tile">
      <div class="label">Detected hits</div>
      <div class="value">${fmtInt(data.totalShots)}</div>
      <div class="foot">racket-wrist contacts across ${data.sessionCount} sessions</div>
    </div>
    <div class="tile">
      <div class="label">Time on court</div>
      <div class="value">${fmtDuration(data.totalElapsedMillis)}</div>
      <div class="foot">${fmtDuration(data.totalPlayingMillis)} estimated active</div>
    </div>
    <div class="tile">
      <div class="label">Average exchange</div>
      <div class="value">${fmt1(data.averageRallyShots)}</div>
      <div class="foot">detected hits · longest ${data.longestRallyShots}</div>
    </div>
    <div class="tile">
      <div class="label">Latest HR load</div>
      <div class="value">${latestHasHrLoad ? fmt1(latest.cardiovascularLoad) : "—"}</div>
      <div class="foot">${latestHasHrLoad
        ? `HRR-min · ${Math.round(latest.heartRateCoverage * 100)}% signal coverage`
        : "requires optical HR and a configured HR profile"}</div>
    </div>`;
  content.appendChild(tiles);

  // Insights first: they say something, whereas the charts only report. Sessions with
  // nothing trustworthy to say produce no insights, and this block is simply absent.
  const recentInsights = [];
  for (const session of data.sessions) {
    for (const insight of session.insights || []) {
      recentInsights.push({ session, insight });
      if (recentInsights.length >= 5) break;
    }
    if (recentInsights.length >= 5) break;
  }

  if (recentInsights.length) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head"><h2>What stood out</h2>
        <p class="card-note">Derived from gaps between your detected racket-wrist hits and
        measured heart rate — not from uncalibrated stroke labels.</p></div>
      <div class="insights">${recentInsights.map(({ session, insight }) => `
        <div class="insight ${insight.severity.toLowerCase()}">
          <div class="body">
            <div class="insight-session">${fmtDateTime(session.startedAtMillis)}</div>
            <h3>${escapeHtml(insight.headline)}</h3>
            <p>${escapeHtml(insight.detail)}</p>
            <div class="evidence">${escapeHtml(insight.evidence)}</div>
          </div>
        </div>`).join("")}</div>`;
    content.appendChild(card);
  }

  const grid = document.createElement("div");
  grid.className = "grid";
  content.appendChild(grid);

  // Detected hits per session over time.
  const perSession = [...data.sessions].reverse().map(s => ({
    label: fmtDateTime(s.startedAtMillis),
    axisLabel: new Date(s.startedAtMillis).toLocaleDateString(undefined, { day: "numeric", month: "short" }),
    value: s.totalShots
  }));
  grid.appendChild(card(
    "Detected hits per session",
    "Racket-wrist contacts over time. One bar per recorded session.",
    host => barChart(host, perSession, { valueLabel: "Detected hits" })
  ));

  // Inferred exchange length distribution.
  grid.appendChild(card(
    "Detected exchange length",
    "Hit bursts inferred from quiet gaps; this is not the full rally score.",
    host => barChart(host, data.rallyHistogram.map(b => ({ label: `${b.label} detected hits`, axisLabel: b.label, value: b.count })),
      { valueLabel: "Exchanges", maxBarWidth: 64 })
  ));

  // Shot mix.
  grid.appendChild(card(
    "Shot mix",
    "Provisional stroke labels across all sessions; use hit volume until calibrated.",
    host => shotMixChart(host, data.shotDistribution)
  ));

  // Transparent activity-volume trend. No readiness or injury thresholds are inferred.
  const volumeCard = card(
    "Estimated active-time volume",
    "Time between detected hits inside inferred exchanges. Descriptive history, not a readiness or injury score.",
    host => volumeChart(host, data.volumeTrend)
  );
  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = `
    <span class="key"><span class="swatch" style="background:var(--series-1)"></span>Last 7 days</span>
    <span class="key"><span class="swatch" style="background:var(--series-3)"></span>Previous 4-week weekly average</span>`;
  volumeCard.appendChild(legend);
  grid.appendChild(volumeCard);

  // Session table — also the accessible fallback for every chart above.
  const tableSection = document.createElement("section");
  const table = document.createElement("div");
  table.className = "card full";
  table.innerHTML = `
      <div class="card-head"><h2>Sessions</h2>
      <p class="card-note">Estimated active:quiet comes from gaps between your detected hits.
      HR load is elapsed minutes x mean heart-rate reserve and appears only with measured optical HR
      plus configured resting and maximum heart rate.
      Open a row for the full detected-exchange timeline.</p></div>
    <div class="chart-scroll">
      <table>
        <thead><tr>
          <th>Date</th><th>Duration</th><th>Hits</th><th>Exchanges</th>
          <th>Avg exchange</th><th>Active : quiet</th><th>Est. active</th>
          <th>Avg HR</th><th>Peak HR</th><th>HRR-min</th>
        </tr></thead>
        <tbody>${data.sessions.map(s => `
          <tr class="rowlink" data-session-id="${escapeHtml(s.id)}" tabindex="0" role="link"
              aria-label="Open session from ${fmtDateTime(s.startedAtMillis)}">
            <td>${fmtDateTime(s.startedAtMillis)}</td>
            <td>${fmtDuration(s.durationMillis)}</td>
            <td>${fmtInt(s.totalShots)}</td>
            <td>${fmtInt(s.rallyCount)}</td>
            <td>${fmt1(s.averageRallyShots)}</td>
            <td>${s.restRatio > 0 ? "1:" + fmt1(s.restRatio) : "—"}</td>
            <td>${Math.round(s.workDensity * 100)}%</td>
            <td>${s.averageHeartRate > 0 ? fmtInt(s.averageHeartRate) : "—"}</td>
            <td>${s.maxHeartRate > 0 ? fmtInt(s.maxHeartRate) : "—"}</td>
            <td>${s.cardiovascularLoad != null && s.heartRateCoverage >= 0.6
              ? fmt1(s.cardiovascularLoad) : "—"}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
  table.querySelectorAll("tr.rowlink").forEach(row => {
    const open = () => {
      location.hash = "#/session/" + encodeURIComponent(row.dataset.sessionId);
    };
    row.addEventListener("click", open);
    row.addEventListener("keydown", evt => {
      if (evt.key === "Enter" || evt.key === " ") { evt.preventDefault(); open(); }
    });
  });
  tableSection.appendChild(table);
  content.appendChild(tableSection);
}

function card(title, note, draw) {
  const c = document.createElement("div");
  c.className = "card";
  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML = `<h2>${title}</h2><p class="card-note">${note}</p>`;
  c.appendChild(head);
  const host = document.createElement("div");
  host.className = "chart-scroll";
  c.appendChild(host);
  requestAnimationFrame(() => draw(host));
  return c;
}

/* ---------- Session detail view ---------- */

// Detail envelopes are small. Diary saves replace the cached reviewed/raw envelope.
const sessionCache = new Map();
const sessionInFlight = new Set();

function sessionIdFromHash() {
  const m = location.hash.match(/^#\/session\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}

function route() {
  const id = sessionIdFromHash();
  if (id != null) {
    renderSessionDetail(id);
    return;
  }
  if (!window.__data) return; // dashboard payload has not landed yet
  render(window.__data);
  if (window.__classifier) {
    renderClassifier(window.__classifier.evaluation, window.__classifier.summary);
  }
}

function sessionErrorHtml(title, text) {
  return `
    <div class="detail-head"><a class="backlink" href="#/">← All sessions</a></div>
    <div class="empty"><h2>${title}</h2><p>${text}</p></div>`;
}

function renderSessionDetail(id) {
  const subtitle = document.getElementById("subtitle");
  const cached = sessionCache.get(id);
  if (cached) {
    renderSession(cached);
    return;
  }
  subtitle.textContent = "Loading session…";
  document.getElementById("content").innerHTML =
    sessionErrorHtml("Loading…", "Fetching the session from the server.");
  if (sessionInFlight.has(id)) return; // route() can fire again while a fetch is out
  sessionInFlight.add(id);
  fetchSessionDetail(id)
    .then(data => {
      sessionInFlight.delete(id);
      sessionCache.set(id, data);
      // The user may have navigated away while the fetch was in flight.
      if (sessionIdFromHash() === id) renderSession(data);
    })
    .catch(err => {
      sessionInFlight.delete(id);
      if (sessionIdFromHash() !== id) return;
      subtitle.textContent = "Session detail";
      const gone = err && err.status === 404;
      const locked = err && err.status === 401;
      document.getElementById("content").innerHTML = gone
        ? sessionErrorHtml("Session not found",
            "No session with this id — it may have been deleted from the server.")
        : locked
          ? sessionErrorHtml("Access required",
              "Reload this page and enter the dashboard token to open the session.")
        : sessionErrorHtml("Could not load session",
            "The server could not be reached. Go back and try again in a moment.");
    });
}

function fetchSessionDetail(id) {
  return apiFetch("api/v1/sessions/" + encodeURIComponent(id) + "/detail")
    .then(r => {
      if (r.status === 404) throw Object.assign(new Error("No such session"), { status: 404 });
      if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { status: r.status });
      return r.json();
    });
}

const ACTIVITY_MODE_OPTIONS = [
  ["Unspecified", "Not reported"], ["SinglesMatch", "Singles match"],
  ["DoublesMatch", "Doubles match"], ["ConditionedGame", "Conditioned game"],
  ["Drill", "Drill"], ["Shadow", "Shadow"], ["FreePlay", "Free play"],
  ["Conditioning", "Conditioning"]
];
const COMPLETION_OPTIONS = [
  ["Unreported", "Not reported"], ["Completed", "Completed"],
  ["StoppedEarly", "Stopped early"]
];
const RECORDING_QUALITY_OPTIONS = [
  ["Unreviewed", "Not reviewed"], ["Complete", "Complete recording"],
  ["Partial", "Partial recording"], ["Unusable", "Unusable recording"]
];
const DRAFT_OPTIONS = [
  ["Unreported", "Not reported"], ["None", "No noticeable draft"],
  ["Light", "Light"], ["Noticeable", "Noticeable"], ["Strong", "Strong"]
];

function diaryOptions(options, selected) {
  return options.map(([value, label]) =>
    `<option value="${value}"${value === selected ? " selected" : ""}>${label}</option>`
  ).join("");
}

function diaryValue(value) {
  return value == null ? "" : escapeHtml(value);
}

function humanizeDiaryValue(value) {
  if (!value) return "Not reported";
  return String(value).replace(/([a-z])([A-Z])/g, "$1 $2")
    .replace(/^./, c => c.toUpperCase());
}

function buildDiaryEditor(data) {
  const raw = data.raw;
  const context = raw.context || {};
  const report = raw.report || {};
  const equipment = context.equipment || {};
  const conditions = context.conditions || {};
  const soreness = report.soreness || [];
  const shell = document.createElement("div");
  shell.className = "card full diary-card";
  shell.innerHTML = `
    <div class="diary-title-row">
      <div><h2>Session diary</h2>
        <p class="card-note">Add the context you remember. Saving changes only this diary;
        immutable detector evidence and correction history stay untouched. Reviewed metrics may
        refresh when your context changes which sessions are comparable.</p></div>
      <span class="diary-state">${escapeHtml(humanizeDiaryValue(context.diaryReviewStatus || "Unreviewed"))}</span>
    </div>
    <form id="sessionDiaryForm">
      <fieldset class="diary-section">
        <legend>Session</legend>
        <div class="diary-grid">
          <div class="diary-field">
            <label for="diaryActivity">Activity</label>
            <select id="diaryActivity" name="activityMode">${diaryOptions(ACTIVITY_MODE_OPTIONS, context.activityMode || "Unspecified")}</select>
          </div>
          <div class="diary-field">
            <label for="diaryTag">Comparison tag</label>
            <input id="diaryTag" name="comparisonTag" maxlength="64" value="${diaryValue(context.comparisonTag)}"
                   placeholder="e.g. rear-court multishuttle">
            <span class="hint">Use the same short tag for sessions you want compared like for like.</span>
          </div>
          <div class="diary-field">
            <label for="diaryCompletion">Plan completion</label>
            <select id="diaryCompletion" name="completion">${diaryOptions(COMPLETION_OPTIONS, context.completion || "Unreported")}</select>
          </div>
          <div class="diary-field">
            <label for="diaryQuality">Recording coverage</label>
            <select id="diaryQuality" name="recordingQuality">${diaryOptions(RECORDING_QUALITY_OPTIONS, context.recordingQuality || "Unreviewed")}</select>
          </div>
          <div class="diary-field">
            <label for="diaryOpponent">Opponent</label>
            <input id="diaryOpponent" name="opponent" maxlength="120" value="${diaryValue(context.opponent)}">
          </div>
          <div class="diary-field">
            <label for="diaryPartner">Partner</label>
            <input id="diaryPartner" name="partner" maxlength="120" value="${diaryValue(context.partner)}">
          </div>
          <div class="diary-field">
            <label for="diaryHall">Hall</label>
            <input id="diaryHall" name="hall" maxlength="160" value="${diaryValue(context.hall)}">
          </div>
          <div class="diary-field">
            <label for="diaryGoal">Goal</label>
            <input id="diaryGoal" name="goal" maxlength="280" value="${diaryValue(context.goal)}"
                   placeholder="What were you working on?">
          </div>
        </div>
      </fieldset>

      <fieldset class="diary-section">
        <legend>How it felt</legend>
        <div class="diary-grid">
          <div class="diary-field">
            <label for="diaryRpe">Reported effort (RPE 0–10)</label>
            <input id="diaryRpe" name="rpe" type="number" min="0" max="10" step="1"
                   value="${report.rpe == null ? "" : escapeHtml(report.rpe)}" placeholder="Not reported">
          </div>
          <div class="diary-field">
            <span class="hint">RPE is your own whole-session rating, not inferred from heart rate.</span>
            <div class="diary-check">
              <input id="diarySorenessReviewed" name="sorenessReviewed" type="checkbox"
                     ${report.sorenessReviewed || soreness.length ? "checked" : ""} ${soreness.length ? "disabled" : ""}>
              <label for="diarySorenessReviewed">I reviewed the soreness question</label>
            </div>
            ${soreness.length ? `<div class="diary-existing">Existing entries retained: ${soreness.map(item => {
              const side = item.side && item.side !== "Unspecified" ? humanizeDiaryValue(item.side) + " " : "";
              return escapeHtml(side + humanizeDiaryValue(item.bodyArea) + " " + item.severity + "/10");
            }).join(" · ")}</div>` : ""}
          </div>
          <div class="diary-field wide">
            <label for="diaryNotes">Notes</label>
            <textarea id="diaryNotes" name="notes" maxlength="2000"
                      placeholder="What mattered, changed, or should be remembered next time?">${diaryValue(report.notes)}</textarea>
          </div>
        </div>
      </fieldset>

      <fieldset class="diary-section">
        <legend>Equipment snapshot</legend>
        <div class="diary-grid">
          <div class="diary-field">
            <label for="diaryRacket">Racket</label>
            <input id="diaryRacket" name="racket" maxlength="120" value="${diaryValue(equipment.racket)}">
          </div>
          <div class="diary-field">
            <label for="diaryString">String</label>
            <input id="diaryString" name="string" maxlength="120" value="${diaryValue(equipment.string)}">
          </div>
          <div class="diary-field">
            <label for="diaryTension">String tension (lb)</label>
            <input id="diaryTension" name="stringTensionLbs" type="number" min="10" max="50"
                   step="0.1" value="${equipment.stringTensionLbs == null ? "" : escapeHtml(equipment.stringTensionLbs)}"
                   placeholder="Not reported">
          </div>
          <div class="diary-field">
            <label for="diaryShoes">Shoes</label>
            <input id="diaryShoes" name="shoes" maxlength="120" value="${diaryValue(equipment.shoes)}">
          </div>
        </div>
      </fieldset>

      <fieldset class="diary-section">
        <legend>Court conditions snapshot</legend>
        <div class="diary-grid">
          <div class="diary-field">
            <label for="diaryShuttleBrand">Shuttle brand / model</label>
            <input id="diaryShuttleBrand" name="shuttleBrand" maxlength="120"
                   value="${diaryValue(conditions.shuttleBrand)}">
          </div>
          <div class="diary-field">
            <label for="diaryShuttleSpeed">Shuttle speed</label>
            <input id="diaryShuttleSpeed" name="shuttleSpeed" maxlength="40"
                   value="${diaryValue(conditions.shuttleSpeed)}" placeholder="e.g. 77 or medium">
          </div>
          <div class="diary-field">
            <label for="diaryTemperature">Temperature (°C)</label>
            <input id="diaryTemperature" name="temperatureCelsius" type="number" min="-30" max="60"
                   step="0.1" value="${conditions.temperatureCelsius == null ? "" : escapeHtml(conditions.temperatureCelsius)}"
                   placeholder="Not reported">
          </div>
          <div class="diary-field">
            <label for="diaryDraft">Draft</label>
            <select id="diaryDraft" name="draft">${diaryOptions(DRAFT_OPTIONS, conditions.draft || "Unreported")}</select>
          </div>
        </div>
      </fieldset>

      <div class="diary-actions">
        <div class="diary-status" id="diaryStatus" role="status" aria-live="polite">
          Saving marks this diary reviewed.
        </div>
        <button class="diary-save" type="submit">Save diary</button>
      </div>
    </form>`;

  const form = shell.querySelector("#sessionDiaryForm");
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    const status = form.querySelector("#diaryStatus");
    const button = form.querySelector(".diary-save");
    const optionalText = name => {
      const value = form.elements[name].value.trim();
      return value === "" ? null : value;
    };
    const optionalNumber = name => {
      const value = form.elements[name].value.trim();
      return value === "" ? null : Number(value);
    };
    const payload = {
      baseDiaryRevision: raw.diaryRevision || 0,
      activityMode: form.elements.activityMode.value,
      comparisonTag: optionalText("comparisonTag"),
      opponent: optionalText("opponent"),
      partner: optionalText("partner"),
      hall: optionalText("hall"),
      goal: optionalText("goal"),
      completion: form.elements.completion.value,
      recordingQuality: form.elements.recordingQuality.value,
      rpe: optionalNumber("rpe"),
      sorenessReviewed: form.elements.sorenessReviewed.checked,
      notes: optionalText("notes"),
      equipment: {
        racket: optionalText("racket"),
        string: optionalText("string"),
        stringTensionLbs: optionalNumber("stringTensionLbs"),
        shoes: optionalText("shoes")
      },
      conditions: {
        shuttleBrand: optionalText("shuttleBrand"),
        shuttleSpeed: optionalText("shuttleSpeed"),
        temperatureCelsius: optionalNumber("temperatureCelsius"),
        draft: form.elements.draft.value
      }
    };

    button.disabled = true;
    status.classList.remove("error");
    status.textContent = "Saving diary…";
    let diarySaved = false;
    try {
      const response = await apiFetch(
        "api/v1/sessions/" + encodeURIComponent(raw.session.id) + "/diary",
        {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }
      );
      if (!response.ok) {
        let message = `Save failed (HTTP ${response.status})`;
        try {
          const error = await response.json();
          if (error.error) message = error.error;
        } catch (_) { /* Keep status-only message. */ }
        throw new Error(message);
      }
      await response.json();
      diarySaved = true;
      sessionCache.delete(raw.session.id);
      const updated = await fetchSessionDetail(raw.session.id);
      sessionCache.set(raw.session.id, updated);
      renderSession(updated);
      const savedStatus = document.getElementById("diaryStatus");
      if (savedStatus) savedStatus.textContent = "Diary saved. Recorded session data is unchanged.";
      apiJson("api/v1/dashboard").then(value => { window.__data = value; }).catch(() => {});
    } catch (error) {
      status.textContent = diarySaved
        ? "Diary saved, but the reviewed detail could not refresh. Reload to see it."
        : error.message || "Could not save diary.";
      status.classList.add("error");
      button.disabled = false;
    }
  });
  return shell;
}

function renderSession(data) {
  const content = document.getElementById("content");
  const subtitle = document.getElementById("subtitle");
  const raw = data.raw;
  const reviewed = data.reviewed;
  const metrics = reviewed.effectiveMetrics;
  const session = reviewed.session, sum = session.summary, rp = reviewed.rallyProfile;
  const rawSession = raw.session, rawSum = rawSession.summary;
  const rawProfile = raw.rallyProfile || {};
  const rallies = (rp && rp.rallies) || [];
  const rawRallies = rawProfile.rallies || [];
  const shots = session.shots || [];
  const work = (rp && rp.totalWorkMillis) || 0;
  const activeShare = sum.durationMillis > 0 ? work / sum.durationMillis : null;
  const longest = rallies.reduce((a, r) => Math.max(a, r.shotCount), 0);
  const avgRally = rallies.length
    ? rallies.reduce((a, r) => a + r.shotCount, 0) / rallies.length : 0;
  const hasHrLoad = hasConfiguredHeartRateReserve(raw.profile) &&
    sum.cardiovascularLoad != null &&
    sum.heartRateSampleCount > 0 && sum.heartRateCoverage >= 0.6;
  const hitRevisions = (raw.corrections && raw.corrections.hitRevisions) || [];
  const trimRevisions = (raw.corrections && raw.corrections.trimRevisions) || [];
  const currentHit = hitRevisions.length ? hitRevisions[hitRevisions.length - 1] : {};
  const correctionRevisionCount = hitRevisions.length + trimRevisions.length;

  subtitle.textContent = `Session · ${fmtDate(rawSession.startedAtMillis)}`;
  content.innerHTML = "";

  const device = String(raw.deviceId || "");
  const head = document.createElement("div");
  head.className = "detail-head";
  head.innerHTML = `
    <a class="backlink" href="#/">← All sessions</a>
    <div class="detail-title">${fmtDateTimeLong(rawSession.startedAtMillis)}</div>
    <div class="detail-meta">Device ${escapeHtml(device.length > 12 ? device.slice(0, 8) + "…" : device)}
      · app ${escapeHtml(String(raw.appVersion || ""))}</div>`;
  content.appendChild(head);

  const appliedParts = [];
  if (metrics.window.trimFromStartMillis || metrics.window.trimFromEndMillis) {
    appliedParts.push(
      `${fmtDuration(metrics.window.trimFromStartMillis)} trimmed from the start and ` +
      `${fmtDuration(metrics.window.trimFromEndMillis)} from the end ` +
      `(${fmtInt(metrics.trimExcludedDetectedHitCount)} hit events outside the review window)`
    );
  }
  if (metrics.falseHitCount || (currentHit.falseHitIds || []).length) {
    appliedParts.push(
      `${fmtInt(metrics.falseHitCount)} resolved false ${metrics.falseHitCount === 1 ? "hit" : "hits"} removed ` +
      `from ${fmtInt((currentHit.falseHitIds || []).length)} referenced event IDs`
    );
  }
  if (metrics.reportedMissedHitCount) {
    appliedParts.push(
      `${fmtInt(metrics.reportedMissedHitCount)} reported missed ${metrics.reportedMissedHitCount === 1 ? "hit" : "hits"} ` +
      "added only to the effective total"
    );
  }
  const banner = document.createElement("div");
  banner.className = "review-banner" + (metrics.hasCorrections ? "" : " clean");
  banner.innerHTML = metrics.hasCorrections ? `
    <div class="kicker">Reviewed view · corrections applied</div>
    <strong>Primary metrics and charts below are reviewed values, not raw model output.</strong>
    <p>${escapeHtml(appliedParts.length
      ? appliedParts.join("; ") + "."
      : "Correction history exists, but its latest revisions do not change the current metrics.")}
      Reported missed hits have no timestamps, so they never enter detected-hit counts,
      exchange timing, provisional shot mix, or charts.</p>` : `
    <div class="kicker">Reviewed view · no corrections</div>
    <strong>Primary metrics currently match the raw detector evidence.</strong>
    <p>No trim, false-hit, or missed-hit revision is applied. Raw evidence is still retained
    in the audit section below.</p>`;
  content.appendChild(banner);

  const tiles = document.createElement("div");
  tiles.className = "tiles";
  tiles.innerHTML = `
    <div class="tile">
      <div class="label">Reviewed detected hits</div>
      <div class="value">${fmtInt(sum.totalShots)}</div>
      <div class="foot">timestamped hits used by exchanges and charts</div>
    </div>
    <div class="tile">
      <div class="label">Reviewed detected exchanges</div>
      <div class="value">${fmtInt(rallies.length)}</div>
      <div class="foot">${longest
        ? fmt1(avgRally) + " hits average · longest " + fmtInt(longest)
        : "no multi-hit exchange after review"}</div>
    </div>
    <div class="tile">
      <div class="label">Reviewed duration</div>
      <div class="value">${fmtDuration(sum.durationMillis)}</div>
      <div class="foot">effective recording window after edge trims</div>
    </div>
    <div class="tile">
      <div class="label">Estimated active</div>
      <div class="value">${fmtDuration(work)}</div>
      <div class="foot">${activeShare != null
        ? Math.round(activeShare * 100) + "% of reviewed duration"
        : "no reviewed duration"}</div>
    </div>
    <div class="tile">
      <div class="label">Avg heart rate</div>
      <div class="value">${sum.averageHeartRate > 0 ? fmtInt(sum.averageHeartRate) : "—"}</div>
      <div class="foot">${sum.averageHeartRate > 0 ? "bpm" : "no readings"}</div>
    </div>
    <div class="tile">
      <div class="label">Peak heart rate</div>
      <div class="value">${sum.maxHeartRate > 0 ? fmtInt(sum.maxHeartRate) : "—"}</div>
      <div class="foot">${sum.maxHeartRate > 0 ? "bpm" : "no readings"}</div>
    </div>
    <div class="tile">
      <div class="label">HR load</div>
      <div class="value">${hasHrLoad ? fmt1(sum.cardiovascularLoad) : "—"}</div>
      <div class="foot">${hasHrLoad
        ? `HRR-min · ${Math.round(sum.heartRateCoverage * 100)}% signal coverage`
        : "requires optical HR and a configured HR profile"}</div>
    </div>
    ${metrics.reportedMissedHitCount ? `<div class="tile">
      <div class="label">Effective hit total</div>
      <div class="value">${fmtInt(metrics.effectiveHitCount)}</div>
      <div class="foot">${fmtInt(metrics.correctedDetectedHitCount)} detected +
        ${fmtInt(metrics.reportedMissedHitCount)} player-reported, untimed</div>
    </div>` : ""}`;
  content.appendChild(tiles);

  const grid = document.createElement("div");
  grid.className = "grid";
  content.appendChild(grid);

  grid.appendChild(buildDiaryEditor(data));

  if ((reviewed.insights || []).length) {
    const insightCard = document.createElement("div");
    insightCard.className = "card full";
    insightCard.innerHTML = `
      <div class="card-head"><h2>Reviewed observations</h2>
        <p class="card-note">Generated from the corrected exchange structure and comparable,
        earlier reviewed sessions only.</p></div>
      <div class="insights">${reviewed.insights.map(insight => `
        <div class="insight ${insight.severity.toLowerCase()}">
          <div class="body">
            <h3>${escapeHtml(insight.headline)}</h3>
            <p>${escapeHtml(insight.detail)}</p>
            <div class="evidence">${escapeHtml(insight.evidence)}</div>
          </div>
        </div>`).join("")}</div>`;
    grid.appendChild(insightCard);
  }

  if (rallies.length) {
    const timelineCard = card(
      "Detected exchange timeline",
      "Each band is a burst inferred from your racket-wrist hits. Ticks are detected hits, " +
        "coloured by provisional type; empty gaps are quiet time.",
      host => rallyTimelineChart(host, reviewed)
    );
    timelineCard.classList.add("full");
    const types = [...new Set(shots.map(s => s.type))]
      .sort((a, b) => (SHOT_SLOT[a] || 99) - (SHOT_SLOT[b] || 99));
    const legend = document.createElement("div");
    legend.className = "legend";
    legend.innerHTML =
      `<span class="key"><span class="swatch" style="background:var(--series-1);opacity:0.4"></span>Exchange band</span>` +
      types.map(t => `<span class="key"><span class="swatch" style="background:var(--series-${SHOT_SLOT[t] || 6})"></span>${escapeHtml(SHOT_LABELS[t] || t)}</span>`).join("");
    timelineCard.appendChild(legend);
    grid.appendChild(timelineCard);
  } else {
    const empty = document.createElement("div");
    empty.className = "card full";
    empty.innerHTML = `
      <div class="card-head"><h2>Detected exchange timeline</h2></div>
      <p style="margin:0;color:var(--text-secondary);font-size:14px">
        No multi-hit exchanges were detected in this session.</p>`;
    grid.appendChild(empty);
  }

  const counts = sum.shotCounts || {};
  const slices = Object.keys(counts)
    .filter(t => counts[t] > 0)
    .sort((a, b) => (SHOT_SLOT[a] || 99) - (SHOT_SLOT[b] || 99))
    .map(t => ({ type: t, count: counts[t] }));
  if (slices.length) {
    grid.appendChild(card(
      "Shot mix",
      "Provisional stroke labels in this session; use hit volume until calibrated.",
      host => shotMixChart(host, slices)
    ));
  }

  const rawEvents = rawSession.shots || [];
  const unknownFalseIds = metrics.unknownFalseHitIds || [];
  const rawSummaryMismatch = rawSum.totalShots !== rawEvents.length
    ? ` The stored raw summary reports ${fmtInt(rawSum.totalShots)} hits while the immutable event list contains ` +
      `${fmtInt(rawEvents.length)}; reviewed analysis uses timestamped event records.`
    : "";
  const audit = document.createElement("div");
  audit.className = "card full audit-card";
  audit.innerHTML = `
    <div class="card-head"><h2>Raw detector evidence · audit and corrections</h2>
      <p class="card-note">Audit only. These original model values are immutable and do not
      drive the reviewed cards, observations, shot mix, or timeline above.</p></div>
    <div class="audit-grid">
      <div class="audit-stat"><div class="k">Raw hit events</div>
        <div class="v">${fmtInt(rawEvents.length)}</div></div>
      <div class="audit-stat"><div class="k">Raw stored exchanges</div>
        <div class="v">${fmtInt(rawRallies.length)}</div></div>
      <div class="audit-stat"><div class="k">Raw elapsed</div>
        <div class="v">${fmtDuration(rawSum.durationMillis)}</div></div>
      <div class="audit-stat"><div class="k">Raw estimated active</div>
        <div class="v">${fmtDuration(rawProfile.totalWorkMillis || 0)}</div></div>
      <div class="audit-stat"><div class="k">Correction revisions</div>
        <div class="v">${fmtInt(correctionRevisionCount)}</div></div>
    </div>
    <p class="audit-notes">
      Current applied correction: trim ${fmtDuration(metrics.window.trimFromStartMillis)} from
      start / ${fmtDuration(metrics.window.trimFromEndMillis)} from end; ${fmtInt(metrics.falseHitCount)}
      resolved false-hit ${metrics.falseHitCount === 1 ? "event" : "events"};
      ${fmtInt(metrics.reportedMissedHitCount)} reported missed ${metrics.reportedMissedHitCount === 1 ? "hit" : "hits"}.
      ${unknownFalseIds.length
        ? `Unresolved false-hit references retained for audit: ${escapeHtml(unknownFalseIds.join(", "))}.`
        : "All current false-hit references resolve to raw event IDs."}${rawSummaryMismatch}
    </p>`;
  grid.appendChild(audit);
}

document.getElementById("themeToggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light"
    : current === "light" ? "dark"
    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  route(); // re-render whichever view is current so SVG colours pick up the theme
});

function renderClassifier(evaluation, summary) {
  const content = document.getElementById("content");
  const card = document.createElement("div");
  card.className = "card full";

  const swings = summary ? summary.totalSwings : 0;
  const perLabel = (summary && summary.swingsPerLabel) || [];

  if (!evaluation || !evaluation.swingCount || !evaluation.perClass.length ||
      evaluation.swingCount < 50) {
    card.innerHTML = `
      <div class="card-head"><h2>Classifier accuracy</h2>
        <p class="card-note">Scored against swings you labelled in a drill.</p></div>
      <p style="margin:0;color:var(--text-secondary);font-size:14px">
        ${swings} labelled swing${swings === 1 ? "" : "s"} collected so far — not enough to
        measure anything yet. Record drills on the watch under <b>Detection lab</b>.
      </p>
      ${perLabel.length ? `<div class="caveat">${perLabel
        .map(l => `${SHOT_LABELS[l.label] || l.label}: ${l.swings}`).join(" · ")}</div>` : ""}`;
    content.appendChild(card);
    return;
  }

  const pct = v => Math.round(v * 100) + "%";
  card.innerHTML = `
    <div class="card-head"><h2>Classifier accuracy</h2>
      <p class="card-note">The shipped rule-based classifier, scored against
      ${evaluation.swingCount} swings you labelled yourself. This is the number a trained
      model has to beat.</p></div>
    <div class="scores">
      <div class="score"><div class="k">Accuracy</div><div class="v">${pct(evaluation.accuracy)}</div></div>
      <div class="score"><div class="k">Macro recall</div><div class="v">${pct(evaluation.macroRecall)}</div></div>
      <div class="score"><div class="k">Macro precision</div><div class="v">${pct(evaluation.macroPrecision)}</div></div>
      <div class="score"><div class="k">Detected at all</div><div class="v">${pct(
        (evaluation.swingCount - evaluation.notDetected) / evaluation.swingCount)}</div></div>
    </div>
    <div class="chart-scroll" style="margin-top:16px">
      <table>
        <thead><tr><th>Stroke</th><th>Labelled</th><th>Recall</th><th>Precision</th><th>Missed</th></tr></thead>
        <tbody>${evaluation.perClass
          .slice().sort((a, b) => b.support - a.support)
          .map(c => `<tr>
            <td>${SHOT_LABELS[c.label] || c.label}</td>
            <td>${c.support}</td>
            <td>${pct(c.recall)}</td>
            <td>${pct(c.precision)}</td>
            <td>${c.notDetected}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="caveat">Macro figures weight every stroke equally, so a rare stroke the
    detector never sees cannot hide behind a common one.</div>`;
  content.appendChild(card);
}

Promise.all([
  apiFetch("api/v1/captures/evaluation").then(r => r.ok ? r.json() : null).catch(() => null),
  apiFetch("api/v1/captures/summary").then(r => r.ok ? r.json() : null).catch(() => null)
]).then(([evaluation, summary]) => {
  window.__classifier = { evaluation, summary };
  if (window.__data && !sessionIdFromHash()) renderClassifier(evaluation, summary);
});

apiJson("api/v1/dashboard")
  .then(data => {
    window.__data = data;
    route();
  })
  .catch(err => {
    if (sessionIdFromHash()) return; // a deep-linked detail view has its own error state
    const locked = err && err.status === 401;
    document.getElementById("subtitle").textContent = locked
      ? "Access required" : "Could not reach the server";
    document.getElementById("content").innerHTML =
      locked
        ? `<div class="empty"><h2>Dashboard locked</h2><p>Reload and enter your access token.</p></div>`
        : `<div class="empty"><h2>Could not load data</h2><p>${escapeHtml(err)}</p></div>`;
  });

window.addEventListener("hashchange", route);
// Initial view from location.hash — no-op for the dashboard until its payload lands.
route();
</script>
</body>
</html>
